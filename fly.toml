# Fly.io: one machine with a volume for the SQLite file and photos.
# Change `app` to a unique name before `fly launch --copy-config --no-deploy`.
app = "sleep-outfit-yourname"
primary_region = "lhr"

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DATA_DIR = "/data"

[mounts]
  source = "sleep_outfit_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep it running so the 7am reminder cron fires.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = "/healthz"
    interval = "30s"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
